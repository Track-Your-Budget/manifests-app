# Template for the Secret the cloudflared Deployment reads its tunnel token
# from (overlays/prod/cloudflared.yaml). Prod only; test has no tunnel.
#
# Usage (by hand on the prod cluster - real secrets are never committed):
#   cp secrets/cloudflared-secret.template.yaml secrets/cloudflared-secret.yaml
#   # paste the token, then:
#   kubectl apply -f secrets/cloudflared-secret.yaml
#   kubectl rollout restart deployment/cloudflared -n cloudflare
#
# The token is the long base64 string after "--token" in the connector
# install command shown in the Cloudflare dashboard (Zero Trust > Networks >
# Tunnels > <tunnel> > Configure). It must be ONE line with no line break:
# a wrapped paste makes cloudflared exit with "Provided Tunnel token is not
# valid". Decoding it (base64 -d twice) shows the tunnel ID in field "t".
#
# "*secret.yaml" is git-ignored, so the filled-in copy stays local. The
# ".template." infix is what keeps this file tracked.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: cloudflare
type: Opaque
stringData:
  token: "<TUNNEL_TOKEN>"
