# Template for the Secret the backend Deployment loads with envFrom
# (base/backend.yaml). Every key becomes an environment variable in both the
# migrate init container and the backend container.
#
# Usage (per cluster, by hand - real secrets are never committed):
#   cp secrets/backend-secret.template.yaml secrets/backend-secret.yaml
#   # fill in the values, then:
#   kubectl apply -n default -f secrets/backend-secret.yaml
#   kubectl rollout restart deployment/budget-backend -n default
#
# "*secret.yaml" is git-ignored, so the filled-in copy stays local. The
# ".template." infix is what keeps this file tracked.
#
# stringData takes plain text; Kubernetes base64-encodes it on apply.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: default
type: Opaque
stringData:
  # Long random string. Generate with:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(64))"
  DJANGO_SECRET_KEY: "<DJANGO_SECRET_KEY>"

  # Public origin of the SPA. Used as the OAuth redirect_uri for the
  # server-side code exchange, so it must equal the redirect_uri registered
  # at Google/GitHub/Microsoft and the one inside the VITE_*_LINK URLs in
  # frontend-secret. Its origin is automatically added to CORS.
  #   prod: https://track-your-budget.de
  #   test: http://dev.track-your-budget.de
  FRONTEND_URL: "<FRONTEND_URL>"

  # Database. In prod these are the role and database you created on the
  # host Postgres; POSTGRES_HOST stays "postgres" because overlays/prod/
  # postgres.yaml maps that name to the host (10.42.0.1).
  POSTGRES_DB: "<POSTGRES_DB>"
  POSTGRES_USER: "<POSTGRES_USER>"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  # Not needed anymore, do NOT add them back:
  #   GOOGLE_CLIENT_ID / GOOGLE_SECRET  -> provider credentials live in the
  #                                        database as allauth SocialApp rows
  #   CALLBACK_URL                       -> replaced by FRONTEND_URL
  #   ALLOWED_HOSTS, DEBUG, JWT_AUTH_SECURE -> plain config, set per overlay
