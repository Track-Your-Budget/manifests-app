# Template for the Secret the frontend Deployment reads (base/frontend.yaml).
# The nginx container's entrypoint writes these three values into
# env-config.js at start, so the SPA picks them up without a rebuild.
#
# Usage (per cluster, by hand - real secrets are never committed):
#   cp secrets/frontend-secret.template.yaml secrets/frontend-secret.yaml
#   # fill in the values, then:
#   kubectl apply -n default -f secrets/frontend-secret.yaml
#   kubectl rollout restart deployment/budget-frontend -n default
#
# Each value is the FULL authorization URL of one provider. Leave a value
# empty ("") to hide that provider's login button. The redirect_uri inside
# each URL must be identical to FRONTEND_URL in backend-secret and to the
# redirect URI registered in the provider's console. URL-encode the
# redirect_uri when in doubt (https%3A%2F%2Ftrack-your-budget.de).
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: default
type: Opaque
stringData:
  VITE_GOOGLE_LINK: "https://accounts.google.com/o/oauth2/v2/auth?client_id=<GOOGLE_CLIENT_ID>&redirect_uri=<FRONTEND_URL>&response_type=code&scope=openid%20email%20profile"
  VITE_GITHUB_LINK: "https://github.com/login/oauth/authorize?client_id=<GITHUB_CLIENT_ID>&redirect_uri=<FRONTEND_URL>&scope=read:user%20user:email"
  VITE_MICROSOFT_LINK: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=<MICROSOFT_CLIENT_ID>&redirect_uri=<FRONTEND_URL>&response_type=code&scope=openid%20email%20profile%20User.Read"
