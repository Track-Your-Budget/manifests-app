apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-frontend
  template:
    metadata:
      labels:
        app: budget-frontend
    spec:
      containers:
      - name: frontend
        # Tag is a placeholder: every overlay pins the real one via `images:`
        # in its kustomization.yaml, so this value is never what gets deployed.
        image: eduardgohl/budget-tracker-frontend:31
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: VITE_GOOGLE_LINK
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: VITE_GOOGLE_LINK
        - name: VITE_GITHUB_LINK
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: VITE_GITHUB_LINK
        - name: VITE_MICROSOFT_LINK
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: VITE_MICROSOFT_LINK
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80

  selector:
    app: budget-frontend