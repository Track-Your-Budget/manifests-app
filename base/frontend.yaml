apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-frontend
  template:
    metadata:
      labels:
        app: budget-frontend
    spec:
      containers:
      - name: frontend
        image: eduardgohl/budget-tracker-frontend:31
        ports:
        - containerPort: 80
        env:
        - name: VITE_GOOGLE_LINK
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: VITE_GOOGLE_LINK
        - name: VITE_GITHUB_LINK
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: VITE_GITHUB_LINK
        - name: VITE_MICROSOFT_LINK
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: VITE_MICROSOFT_LINK
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80

  selector:
    app: budget-frontend