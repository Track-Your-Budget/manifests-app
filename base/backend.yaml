apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Uploaded avatars. Without this the files a social login downloads live in
  # the container filesystem and disappear on every restart - and the download
  # only runs once, when the SocialAccount is first created, so they never
  # come back.
  name: backend-media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-backend
spec:
  replicas: 1
  # The media PVC is ReadWriteOnce, so the replacement pod cannot mount it
  # while the old one still holds it. Recreate avoids that deadlock, same as
  # budget-db does for its data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: budget-backend
  template:
    metadata:
      labels:
        app: budget-backend
    spec:
      initContainers:
      - name: migrate
        # Tag is a placeholder: every overlay pins the real one via `images:`
        # in its kustomization.yaml, so this value is never what gets deployed.
        image: eduardgohl/budget-tracker-backend:31
        command: ["python", "manage.py", "migrate", "--noinput"]
        # Whole secret at once. Listing keys individually meant maintaining the
        # same list twice, and the two copies had already drifted apart.
        envFrom:
        - secretRef:
            name: backend-secret
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      containers:
      - name: backend
        image: eduardgohl/budget-tracker-backend:31
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: backend-secret
        # Plain config, not secrets. Both are safe defaults that overlays may
        # override; without them Django would fall back to its own defaults,
        # which is how DEBUG ended up implicit.
        env:
        - name: DEBUG
          value: "False"
        - name: JWT_AUTH_SECURE
          value: "True"
        volumeMounts:
        - name: media
          mountPath: /app/media
        # Django rejects any request whose Host is not in ALLOWED_HOSTS with a
        # 400, and the kubelet sends the pod IP by default - which would mean
        # the pod never becomes ready. Hence the explicit Host header; keep
        # "localhost" in ALLOWED_HOSTS for every environment.
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: backend-media
---
apiVersion: v1
kind: Service
metadata:
  # Name must be "backend" - the frontend's nginx config has
  # "proxy_pass http://backend:8000" baked in at image build time.
  name: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: budget-backend
