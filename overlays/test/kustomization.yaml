patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.track-your-budget.de
  target:
    kind: Ingress
    name: budget-ingress
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: budget-backend
    spec:
      template:
        spec:
          containers:
          - name: backend
            env:
            - name: ALLOWED_HOSTS
              value: "dev.track-your-budget.de,localhost,127.0.0.1"
            # Test runs with debug on by choice: full tracebacks in the browser
            # and in the logs. Base keeps "False" so prod cannot inherit this.
            # Safe(r) only because MEDIA_ROOT is now a dedicated directory - it
            # used to be BASE_DIR, where DEBUG=True served .env over /media/.
            - name: DEBUG
              value: "True"
            # This host is plain HTTP. A Secure refresh cookie would never be
            # sent back, so the session would die at every access-token expiry
            # (5 min). Base keeps "True" for the HTTPS environments.
            - name: JWT_AUTH_SECURE
              value: "False"
