apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
- ../../base
- postgres.yaml

# Azure DevOps ändert in Zukunft diese Tags via "kustomize edit set image ..."
images:
- name: eduardgohl/budget-tracker-backend
  newName: eduardgohl/budget-tracker-backend
  newTag: "33"
- name: eduardgohl/budget-tracker-frontend
  newName: eduardgohl/budget-tracker-frontend
  newTag: "33"

# Hostname für Dev-Umgebung überschreiben
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.track-your-budget.de
  target:
    kind: Ingress
    name: budget-ingress
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: budget-backend
    spec:
      template:
        spec:
          containers:
          - name: backend
            env:
            - name: ALLOWED_HOSTS
              value: "dev.track-your-budget.de,localhost,127.0.0.1"
  target:
    kind: Deployment
    name: budget-backend
