apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
- ../../base
- postgres.yaml

# Azure DevOps ändert in Zukunft diese Tags via "kustomize edit set image ..."
images:
- name: eduardgohl/budget-tracker-backend
  newName: eduardgohl/budget-tracker-backend
  newTag: "49"
- name: eduardgohl/budget-tracker-frontend
  newName: eduardgohl/budget-tracker-frontend
  newTag: "49"


# Strategic merge, matched on the env var's name. The previous version replaced
# env index 0, which only happened to be ALLOWED_HOSTS - inserting any variable
# ahead of it in base would have silently overwritten the wrong one.
# `env` beats `envFrom` for the same key, so this wins over the secret value.
# env entries merge on `name`, so DEBUG here overrides the "False" from base.
