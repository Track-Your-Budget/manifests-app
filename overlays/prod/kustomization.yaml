apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod = the application (app/, pinned to namespace default) + the Cloudflare
# Tunnel connector that exposes it (cloudflared.yaml, namespace cloudflare).
# No `namespace:` at this level on purpose: it would override the namespace
# of every resource below, and the two halves need different ones.
resources:
- app
- cloudflared.yaml

# Azure DevOps writes the prod tags here via "kustomize edit set image ...".
# The image transformer applies to all resources this directory emits, so
# the Deployments coming from app/ pick these tags up.
images:
- name: eduardgohl/budget-tracker-backend
  newName: eduardgohl/budget-tracker-backend
  newTag: "50"
- name: eduardgohl/budget-tracker-frontend
  newName: eduardgohl/budget-tracker-frontend
  newTag: "50"
